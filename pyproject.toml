[tool.ruff]
target-version = "py310"
line-length = 88

extend-exclude = [
    ".git",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/__manifest__.py" = ["B018"]

[tool.ruff.lint.isort]
known-third-party = ["odoo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
